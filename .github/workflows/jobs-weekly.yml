name: Refresh jobs weekly

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out atlas
        uses: actions/checkout@v4
      - name: Refresh open roles
        run: node scripts/update-jobs.mjs
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/jobs.json dist/jobs-data.js; then
            echo "No job changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json dist/jobs-data.js
          git commit -m "Update weekly jobs feed"
          git push
