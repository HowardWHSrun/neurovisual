:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {

  min-height: 28px;
  align-items: center;
  justify-content: center;

  border: 1px solid var(--input);

}

.btn:is(.btn-block, .viz-tile) {

}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

  padding: 0 8px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);

.form-select:focus-visible {

.form-check {

  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

      {id:&#x27;meg&#x27;,n:&#x27;MEG and OPM-MEG&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:.2,y:3,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Magnetic fields from neural currents&#x27;,res:&#x27;mm-cm after source modeling&#x27;,temp:&#x27;millisecond&#x27;,duration:&#x27;minutes to hours&#x27;,summary:&#x27;MEG preserves fast population dynamics; optically pumped magnetometers are pushing toward wearable, movement-tolerant systems.&#x27;,mechanism:&#x27;SQUID or atomic magnetometers detect femtotesla magnetic fields produced by synchronized intracellular currents.&#x27;,standing:&#x27;Clinical/research MEG is mature but expensive; wearable OPM-MEG is emerging.&#x27;,promise:&#x27;Fast whole-head mapping with less skull distortion than EEG.&#x27;,limit:&#x27;Magnetic shielding, sensor calibration and source ambiguity.&#x27;,ex:[&#x27;epilepsy mapping&#x27;,&#x27;developmental imaging&#x27;,&#x27;OPM helmets&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p1&#x27;]},

      {id:&#x27;silicon&#x27;,n:&#x27;Michigan-style silicon probes&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:4,y:2,i:[&#x27;research&#x27;],signal:&#x27;Spikes and LFP along a shank&#x27;,res:&#x27;tens of micrometers&#x27;,temp:&#x27;sub-ms&#x27;,duration:&#x27;acute to chronic&#x27;,summary:&#x27;Planar shanks distribute many sites through cortical depth and underpin modern laminar electrophysiology.&#x27;,mechanism:&#x27;Lithographic electrode sites sample extracellular potentials along one or more penetrating shafts.&#x27;,standing:&#x27;Research workhorse with continuing materials and packaging innovation.&#x27;,promise:&#x27;Precise laminar geometry and scalable microfabrication.&#x27;,limit:&#x27;Mechanical mismatch, micromotion and chronic glial response.&#x27;,ex:[&#x27;NeuroNexus&#x27;,&#x27;laminar probes&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p1&#x27;,&#x27;p2&#x27;,&#x27;p8&#x27;]},
      {id:&#x27;neuropixels&#x27;,n:&#x27;Neuropixels 1.0 / 2.0&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:4,y:2.4,i:[&#x27;research&#x27;],signal:&#x27;Hundreds of simultaneous spike channels&#x27;,res:&#x27;dense sites across multiple regions&#x27;,temp:&#x27;30 kHz-class sampling&#x27;,duration:&#x27;weeks to months&#x27;,summary:&#x27;Integrated silicon probes transformed large-scale electrophysiology by recording hundreds of neurons across brain regions on one shank.&#x27;,mechanism:&#x27;On-shank amplification, multiplexing and dense selectable sites turn a thin probe into a high-channel-count recording system.&#x27;,standing:&#x27;Broadly adopted in animal research; human intraoperative research is emerging.&#x27;,promise:&#x27;Large-scale, precisely registered spiking data.&#x27;,limit:&#x27;Rigid penetrating geometry and heavy data/curation burden.&#x27;,ex:[&#x27;Neuropixels 2.0&#x27;,&#x27;human Neuropixels&#x27;],s:[&#x27;np2&#x27;],p:[&#x27;p8&#x27;,&#x27;p10&#x27;]},

      {id:&#x27;mesh&#x27;,n:&#x27;Mesh and syringe-injectable electronics&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:4,y:1.2,i:[&#x27;research&#x27;],signal:&#x27;Spikes / field potentials&#x27;,res:&#x27;distributed cellular mesh&#x27;,temp:&#x27;millisecond&#x27;,duration:&#x27;chronic animal studies&#x27;,summary:&#x27;Macroporous electronics seek seamless three-dimensional integration by letting cells, vessels and processes occupy the device volume.&#x27;,mechanism:&#x27;Ultra-soft open meshes are injected or implanted and unfold within neural tissue.&#x27;,standing:&#x27;Preclinical research platform.&#x27;,promise:&#x27;Tissue-like mechanics and distributed coverage.&#x27;,limit:&#x27;Precise deployment, packaging, retrieval and scale.&#x27;,ex:[&#x27;syringe-injectable mesh electronics&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p8&#x27;]},

      {id:&#x27;connectome&#x27;,n:&#x27;Volume-EM connectomics&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:4,y:3.8,i:[&#x27;research&#x27;],signal:&#x27;Synapse-resolved ultrastructure&#x27;,res:&#x27;nanometer voxels across large tissue volumes&#x27;,temp:&#x27;static ex vivo reconstruction&#x27;,duration:&#x27;months to years of acquisition and analysis&#x27;,summary:&#x27;Automated electron microscopy and segmentation reconstruct wiring diagrams from axons, dendrites and synapses.&#x27;,mechanism:&#x27;Serial sections or block-face imaging produce massive 3D volumes that machine-learning pipelines segment into cells and connections.&#x27;,standing:&#x27;Established at insect-brain and selected mammalian-circuit scales; whole adult human-brain reconstruction is far beyond current capacity.&#x27;,promise:&#x27;Ground-truth circuit architecture at synaptic resolution.&#x27;,limit:&#x27;Petabyte-to-exabyte data, segmentation errors, static snapshots and lost molecular/functional context.&#x27;,ex:[&#x27;fly connectomes&#x27;,&#x27;MICrONS cortical volume&#x27;],s:[&#x27;nih&#x27;],p:[]},
      {id:&#x27;cellatlas&#x27;,n:&#x27;Cell census and spatial omics&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:4,y:3.5,i:[&#x27;research&#x27;,&#x27;medical&#x27;],signal:&#x27;RNA, epigenome, morphology and location&#x27;,res:&#x27;single-cell to spatial tissue maps&#x27;,temp:&#x27;developmental / disease snapshots&#x27;,duration:&#x27;atlas programs&#x27;,summary:&#x27;Large consortia classify nervous-system cell types and place molecular identity back into anatomical circuits.&#x27;,mechanism:&#x27;Single-cell sequencing, spatial transcriptomics, morphology and physiology are integrated into common taxonomies and reference atlases.&#x27;,standing:&#x27;Major BRAIN Initiative and international data resources now exist; clinical interpretation is emerging.&#x27;,promise:&#x27;Cell-type targets for recording, modulation and precision therapy.&#x27;,limit:&#x27;Cross-species alignment, state-versus-type ambiguity, sampling bias and rapidly evolving taxonomies.&#x27;,ex:[&#x27;BICCN&#x27;,&#x27;BICAN&#x27;,&#x27;Allen cell-type atlases&#x27;],s:[&#x27;nih&#x27;],p:[]},
      {id:&#x27;clearing&#x27;,n:&#x27;Tissue clearing and light-sheet microscopy&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:3.8,y:3.6,i:[&#x27;research&#x27;],signal:&#x27;Fluorescent anatomy across intact tissue&#x27;,res:&#x27;cellular to organ scale&#x27;,temp:&#x27;static ex vivo maps&#x27;,duration:&#x27;days to weeks&#x27;,summary:&#x27;Cleared transparent tissue plus light-sheet imaging reveals whole-brain cells, projections and molecular labels in three dimensions.&#x27;,mechanism:&#x27;Chemical processing reduces lipid scattering while preserving labels; planar illumination images large volumes rapidly.&#x27;,standing:&#x27;Widely used preclinical mapping platform with many protocol variants.&#x27;,promise:&#x27;Bridge microscopic identity and whole-brain anatomy.&#x27;,limit:&#x27;Tissue distortion, antibody penetration, data size and loss of live dynamics.&#x27;,ex:[&#x27;CLARITY&#x27;,&#x27;iDISCO&#x27;,&#x27;SHIELD&#x27;],s:[&#x27;nih&#x27;],p:[]},
      {id:&#x27;patchseq&#x27;,n:&#x27;Patch-seq multimodal phenotyping&#x27;,g:&#x27;record&#x27;,o:&#x27;read&#x27;,x:4,y:3.2,i:[&#x27;research&#x27;],signal:&#x27;Electrophysiology + transcriptome + morphology&#x27;,res:&#x27;single cell&#x27;,temp:&#x27;acute recording plus molecular endpoint&#x27;,duration:&#x27;cell-by-cell datasets&#x27;,summary:&#x27;Patch-seq links how a neuron fires to what genes it expresses and what shape it has.&#x27;,mechanism:&#x27;Whole-cell patch clamp records physiology, cytoplasm is aspirated for RNA sequencing, and the filled cell is reconstructed anatomically.&#x27;,standing:&#x27;Mature specialized research workflow feeding cell-type atlases.&#x27;,promise:&#x27;Unified definitions of neuronal identity and function.&#x27;,limit:&#x27;Low throughput, technical dropout and multimodal alignment.&#x27;,ex:[&#x27;multimodal cortical cell types&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p2&#x27;]},

      {id:&#x27;dbs&#x27;,n:&#x27;Deep brain stimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:4,y:4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Electrical pulses to deep networks&#x27;,res:&#x27;mm-scale volume of tissue activated&#x27;,temp:&#x27;microsecond pulses; chronic therapy&#x27;,duration:&#x27;years&#x27;,summary:&#x27;Implanted pulse generators modulate deep circuits for movement disorders and selected neurological conditions.&#x27;,mechanism:&#x27;Stereotactic leads deliver charge-balanced pulses that recruit axons and reshape network activity rather than simply silencing a nucleus.&#x27;,standing:&#x27;Established therapy for Parkinson disease, essential tremor and other indications; target and programming remain individualized.&#x27;,promise:&#x27;Adjustable, reversible circuit therapy.&#x27;,limit:&#x27;Surgery, energy, side effects, programming burden and incomplete mechanistic specificity.&#x27;,ex:[&#x27;STN DBS&#x27;,&#x27;GPi DBS&#x27;,&#x27;directional leads&#x27;],s:[&#x27;bmiRules&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;adbs&#x27;,n:&#x27;Adaptive deep brain stimulation&#x27;,g:&#x27;compute&#x27;,o:&#x27;closed&#x27;,x:4,y:2.7,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;LFP or behavioral biomarker -&gt; stimulation&#x27;,res:&#x27;lead-local sensing and stimulation&#x27;,temp:&#x27;real-time feedback&#x27;,duration:&#x27;chronic&#x27;,summary:&#x27;Adaptive DBS changes stimulation from fixed dosing to biomarker-driven control.&#x27;,mechanism:&#x27;Implanted sensing detects a patient-specific neural or behavioral state and adjusts stimulation within programmed safety bounds.&#x27;,standing:&#x27;Randomized feasibility evidence is positive; larger clinical programs and newer gait-synchronized strategies are advancing.&#x27;,promise:&#x27;Better symptom coverage with less off-target stimulation and energy.&#x27;,limit:&#x27;Biomarker drift, control design, generalization and safety validation.&#x27;,ex:[&#x27;beta-triggered aDBS&#x27;,&#x27;gait-phase aDBS&#x27;],s:[&#x27;adbs&#x27;,&#x27;gait&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;rns&#x27;,n:&#x27;Responsive neurostimulation&#x27;,g:&#x27;compute&#x27;,o:&#x27;closed&#x27;,x:3.6,y:3.5,i:[&#x27;medical&#x27;],signal:&#x27;ECoG seizure patterns -&gt; stimulation&#x27;,res:&#x27;one or two focal networks&#x27;,temp:&#x27;continuous detection&#x27;,duration:&#x27;years&#x27;,summary:&#x27;An implanted closed-loop system detects patient-specific epileptiform activity and delivers responsive stimulation.&#x27;,mechanism:&#x27;Depth or strip leads continuously sense electrocorticography; a classifier triggers brief therapy at configured targets.&#x27;,standing:&#x27;FDA-approved for selected adults with drug-resistant focal epilepsy.&#x27;,promise:&#x27;Reversible, data-rich therapy for unresectable or multifocal cases.&#x27;,limit:&#x27;Slow optimization, variable response and limited electrode coverage.&#x27;,ex:[&#x27;NeuroPace RNS&#x27;],s:[&#x27;bmiRules&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;icms&#x27;,n:&#x27;Intracortical microstimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:4,y:2.4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Microampere-scale cortical pulses&#x27;,res:&#x27;local cortical populations&#x27;,temp:&#x27;sub-ms pulses and patterned trains&#x27;,duration:&#x27;acute to multi-year studies&#x27;,summary:&#x27;ICMS writes artificial touch, vision or causal perturbations directly into cortex.&#x27;,mechanism:&#x27;Small penetrating contacts inject current that preferentially activates nearby axons and distributed downstream networks.&#x27;,standing:&#x27;Long-standing research method with ongoing human sensory-restoration trials.&#x27;,promise:&#x27;Spatially addressable artificial sensation and bidirectional BCI.&#x27;,limit:&#x27;Naturalness, stability, tissue response, charge safety and population interactions.&#x27;,ex:[&#x27;somatosensory feedback&#x27;,&#x27;visual phosphenes&#x27;],s:[&#x27;fdaBci&#x27;],p:[&#x27;p5&#x27;,&#x27;p6&#x27;,&#x27;p12&#x27;,&#x27;p13&#x27;]},
      {id:&#x27;stimnet&#x27;,n:&#x27;Ultraflexible StimNET&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:4,y:1.4,i:[&#x27;research&#x27;],signal:&#x27;Low-charge focal ICMS&#x27;,res:&#x27;cellular-scale flexible contacts&#x27;,temp:&#x27;precise pulse trains&#x27;,duration:&#x27;8+ months in mice&#x27;,summary:&#x27;Flexible stimulation threads combine low threshold, focal activation and chronic tissue integration.&#x27;,mechanism:&#x27;Tissue-compliant microelectrodes reduce electrode-neuron distance and foreign-body response, enabling low-current stimulation.&#x27;,standing:&#x27;Compelling chronic rodent evidence; not yet a human device.&#x27;,promise:&#x27;Stable high-dimensional write-in with lower charge and off-target activation.&#x27;,limit:&#x27;Scaling, multichannel safety, packaging and human translation.&#x27;,ex:[&#x27;StimNET&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p5&#x27;,&#x27;p6&#x27;,&#x27;p12&#x27;]},
      {id:&#x27;corticalstim&#x27;,n:&#x27;Cortical surface stimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:3.2,y:3.2,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Electrical cortical stimulation&#x27;,res:&#x27;mm-cm surface regions&#x27;,temp:&#x27;pulses / trains&#x27;,duration:&#x27;acute mapping to chronic systems&#x27;,summary:&#x27;Surface stimulation maps eloquent cortex and can modulate motor, sensory or language networks without penetrating tissue.&#x27;,mechanism:&#x27;ECoG contacts pass current across superficial cortex, recruiting local and connected neural elements.&#x27;,standing:&#x27;Established intraoperative and epilepsy-mapping method; chronic restorative uses are investigational.&#x27;,promise:&#x27;Broad cortical access with less tissue penetration than ICMS.&#x27;,limit:&#x27;Coarser selectivity, current spread and seizure risk.&#x27;,ex:[&#x27;direct cortical stimulation&#x27;,&#x27;motor cortex stimulation&#x27;],s:[&#x27;bmiRules&#x27;],p:[&#x27;p12&#x27;,&#x27;p13&#x27;]},
      {id:&#x27;ees&#x27;,n:&#x27;Epidural spinal cord stimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:3.1,y:3.3,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Spatiotemporal spinal stimulation&#x27;,res:&#x27;segment- and root-selective&#x27;,temp:&#x27;gait-phase patterned trains&#x27;,duration:&#x27;chronic implants&#x27;,summary:&#x27;Spinal stimulation raises network excitability and can restore assisted standing, walking or arm function when paired with intent and rehabilitation.&#x27;,mechanism:&#x27;Epidural contacts recruit dorsal roots and spinal circuits using anatomically targeted pulse patterns.&#x27;,standing:&#x27;Established for pain; restorative motor applications have strong human feasibility evidence and expanding trials.&#x27;,promise:&#x27;Re-engage residual pathways and spinal pattern-generating circuits.&#x27;,limit:&#x27;Patient selection, intensive calibration and rehabilitation, surgery and incomplete recovery.&#x27;,ex:[&#x27;STIMO&#x27;,&#x27;ARC-EX / transcutaneous variants&#x27;],s:[&#x27;ees&#x27;,&#x27;lorach&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;fes&#x27;,n:&#x27;Functional electrical stimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:1.2,y:4,i:[&#x27;medical&#x27;,&#x27;personal&#x27;],signal:&#x27;Motor-nerve / muscle stimulation&#x27;,res:&#x27;muscle or nerve territory&#x27;,temp:&#x27;movement-synchronized pulses&#x27;,duration:&#x27;sessions to chronic implants&#x27;,summary:&#x27;FES converts electrical pulses into useful movement for grasping, stepping, cycling, breathing or bladder control.&#x27;,mechanism:&#x27;Surface, percutaneous or implanted electrodes depolarize peripheral motor axons in coordinated patterns.&#x27;,standing:&#x27;Established rehabilitation and assistive technology for selected uses.&#x27;,promise:&#x27;Direct, practical restoration of movement and conditioning.&#x27;,limit:&#x27;Fatigue, selectivity, electrode placement and absent natural sensory feedback.&#x27;,ex:[&#x27;FES cycling&#x27;,&#x27;peroneal stimulators&#x27;,&#x27;diaphragm pacing&#x27;],s:[&#x27;bmiRules&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;vns&#x27;,n:&#x27;Vagus nerve stimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:2.1,y:4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Peripheral afferent neuromodulation&#x27;,res:&#x27;distributed brainstem / forebrain networks&#x27;,temp:&#x27;intermittent trains&#x27;,duration:&#x27;years&#x27;,summary:&#x27;Cervical or transcutaneous vagal stimulation modulates broad autonomic and central networks.&#x27;,mechanism:&#x27;Electrical pulses recruit vagal afferents that engage nucleus tractus solitarius and downstream neuromodulatory systems.&#x27;,standing:&#x27;Implanted VNS is established for selected epilepsy and depression; non-invasive indications vary by jurisdiction.&#x27;,promise:&#x27;Network modulation without intracranial surgery and pairing with rehabilitation.&#x27;,limit:&#x27;Broad effects, side effects, dosing uncertainty and mechanism heterogeneity.&#x27;,ex:[&#x27;implanted VNS&#x27;,&#x27;paired VNS rehab&#x27;,&#x27;transcutaneous VNS&#x27;],s:[&#x27;bmiRules&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;cochlear&#x27;,n:&#x27;Cochlear implant&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:2.7,y:4,i:[&#x27;medical&#x27;],signal:&#x27;Sound -&gt; auditory-nerve stimulation&#x27;,res:&#x27;tonotopic multichannel array&#x27;,temp:&#x27;audio-rate pulse trains&#x27;,duration:&#x27;decades&#x27;,summary:&#x27;The most successful sensory neuroprosthesis converts sound into patterned electrical stimulation of the auditory nerve.&#x27;,mechanism:&#x27;A microphone and processor encode sound; an implanted electrode array stimulates different cochlear regions by frequency.&#x27;,standing:&#x27;Established, FDA-regulated therapy for severe-to-profound hearing loss.&#x27;,promise:&#x27;Useful speech perception and communication at population scale.&#x27;,limit:&#x27;Outcome variability, limited pitch/music fidelity and surgical/device lifecycle issues.&#x27;,ex:[&#x27;multichannel cochlear implants&#x27;],s:[&#x27;fdaCochlear&#x27;],p:[&#x27;p6&#x27;,&#x27;p13&#x27;]},
      {id:&#x27;retinal&#x27;,n:&#x27;Retinal prostheses&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:3,y:2.6,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Camera / light -&gt; retinal stimulation&#x27;,res:&#x27;electrode-array phosphenes&#x27;,temp:&#x27;video-rate patterns&#x27;,duration:&#x27;chronic implants&#x27;,summary:&#x27;Electrical retinal implants bypass lost photoreceptors to evoke coarse visual percepts.&#x27;,mechanism:&#x27;Epiretinal, subretinal or suprachoroidal arrays stimulate surviving retinal circuits using image-derived patterns.&#x27;,standing:&#x27;Human devices demonstrated limited functional vision; commercial availability has been fragile and next-generation approaches are investigational.&#x27;,promise:&#x27;Restore spatial vision without penetrating the brain.&#x27;,limit:&#x27;Low resolution, variable percepts, retinal remodeling and long-term support.&#x27;,ex:[&#x27;Argus II legacy&#x27;,&#x27;PRIMA photovoltaic retina&#x27;],s:[&#x27;fdaBci&#x27;],p:[&#x27;p6&#x27;,&#x27;p12&#x27;]},
      {id:&#x27;abi&#x27;,n:&#x27;Auditory brainstem implant&#x27;,g:&#x27;restore&#x27;,o:&#x27;write&#x27;,x:4,y:3.3,i:[&#x27;medical&#x27;],signal:&#x27;Sound -&gt; cochlear-nucleus stimulation&#x27;,res:&#x27;surface electrode array&#x27;,temp:&#x27;audio-derived pulse trains&#x27;,duration:&#x27;years&#x27;,summary:&#x27;An ABI bypasses both cochlea and auditory nerve for people who cannot use a cochlear implant.&#x27;,mechanism:&#x27;A paddle array placed on the cochlear nucleus delivers frequency-coded electrical stimulation.&#x27;,standing:&#x27;Specialized clinical therapy with more limited speech outcomes than cochlear implants.&#x27;,promise:&#x27;Auditory access when the peripheral nerve is unavailable.&#x27;,limit:&#x27;Difficult placement, coarse tonotopy and non-auditory side effects.&#x27;,ex:[&#x27;NF2 auditory brainstem implant&#x27;],s:[&#x27;fdaCochlear&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;tms&#x27;,n:&#x27;Transcranial magnetic stimulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:.2,y:4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Induced cortical electric field&#x27;,res:&#x27;cm-scale superficial cortex&#x27;,temp:&#x27;single pulses to repeated trains&#x27;,duration:&#x27;sessions / treatment courses&#x27;,summary:&#x27;TMS non-invasively perturbs cortical networks and is clinically established for selected psychiatric and neurological indications.&#x27;,mechanism:&#x27;A rapidly changing magnetic field induces current in superficial cortex without scalp electrodes.&#x27;,standing:&#x27;Established clinical rTMS platform with multiple cleared systems and active protocol innovation.&#x27;,promise:&#x27;Causal human neuroscience and non-invasive therapy.&#x27;,limit:&#x27;Superficial reach, acoustic/somatic co-stimulation, targeting and response variability.&#x27;,ex:[&#x27;rTMS&#x27;,&#x27;theta-burst stimulation&#x27;,&#x27;TMS-EEG&#x27;],s:[&#x27;fdaTms&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;tes&#x27;,n:&#x27;tDCS / tACS / tES&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:.9,y:2.8,i:[&#x27;medical&#x27;,&#x27;research&#x27;,&#x27;personal&#x27;],signal:&#x27;Weak transcranial electric fields&#x27;,res:&#x27;diffuse cm-scale networks&#x27;,temp:&#x27;DC or oscillatory minutes-long dosing&#x27;,duration:&#x27;sessions&#x27;,summary:&#x27;Transcranial electrical stimulation biases neural excitability or rhythms using scalp electrodes.&#x27;,mechanism:&#x27;Low current flows between electrodes and subtly polarizes distributed neural tissue, usually below direct firing threshold.&#x27;,standing:&#x27;Large research literature and selected clinical use; consumer claims often exceed evidence.&#x27;,promise:&#x27;Low cost, portable and easy to combine with training.&#x27;,limit:&#x27;Small, variable effects; diffuse current; montage and blinding challenges.&#x27;,ex:[&#x27;tDCS&#x27;,&#x27;tACS&#x27;,&#x27;HD-tES&#x27;],s:[&#x27;nih&#x27;,&#x27;ethics&#x27;],p:[&#x27;p13&#x27;]},
      {id:&#x27;tfus&#x27;,n:&#x27;Low-intensity focused ultrasound&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:.3,y:2.1,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Focused acoustic neuromodulation&#x27;,res:&#x27;mm-scale deep target potential&#x27;,temp:&#x27;pulse trains&#x27;,duration:&#x27;acute sessions&#x27;,summary:&#x27;tFUS aims to non-invasively modulate deep brain targets with finer spatial focus than TMS or tES.&#x27;,mechanism:&#x27;Transcranial acoustic pressure perturbs neural membranes and mechanosensitive processes; mechanisms remain under study.&#x27;,standing:&#x27;Growing human feasibility literature; therapeutic efficacy and dose standards are not established.&#x27;,promise:&#x27;Deep, focal, non-invasive circuit access.&#x27;,limit:&#x27;Skull distortion, mechanism uncertainty, auditory confounds and safety dosimetry.&#x27;,ex:[&#x27;theta-burst TUS&#x27;,&#x27;ultrasound BCI modulation&#x27;],s:[&#x27;tfus&#x27;,&#x27;nih&#x27;],p:[]},
      {id:&#x27;mrgfus&#x27;,n:&#x27;MR-guided focused ultrasound ablation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:.1,y:3.5,i:[&#x27;medical&#x27;],signal:&#x27;Thermal lesioning&#x27;,res:&#x27;mm-scale deep target&#x27;,temp:&#x27;one-time intervention&#x27;,duration:&#x27;permanent lesion&#x27;,summary:&#x27;High-intensity focused ultrasound creates image-guided lesions without open cranial surgery.&#x27;,mechanism:&#x27;Converging ultrasound beams heat a stereotactic target while MRI thermometry monitors dose.&#x27;,standing:&#x27;Clinical therapy for selected essential tremor and other indications.&#x27;,promise:&#x27;Incisionless, precise lesioning.&#x27;,limit:&#x27;Irreversible, skull eligibility constraints and limited target geometry.&#x27;,ex:[&#x27;thalamotomy&#x27;],s:[&#x27;bmiRules&#x27;],p:[]},
      {id:&#x27;opto&#x27;,n:&#x27;Optogenetics&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:3.9,y:1.6,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Light-gated cell activity&#x27;,res:&#x27;cell-type / projection specificity&#x27;,temp:&#x27;millisecond&#x27;,duration:&#x27;chronic expression&#x27;,summary:&#x27;Optogenetics provides genetically targeted, temporally precise control of defined neural populations.&#x27;,mechanism:&#x27;Viral or transgenic expression of light-sensitive ion channels converts patterned light into excitation or inhibition.&#x27;,standing:&#x27;Foundational animal-research tool; a retinal human study showed partial visual recovery, but CNS therapy remains experimental.&#x27;,promise:&#x27;Exceptional biological specificity and causal circuit dissection.&#x27;,limit:&#x27;Gene delivery, light access, immune response and clinical ethics.&#x27;,ex:[&#x27;channelrhodopsin&#x27;,&#x27;inhibitory opsins&#x27;,&#x27;retinal therapy&#x27;],s:[&#x27;opto&#x27;,&#x27;nih&#x27;],p:[&#x27;p4&#x27;,&#x27;p6&#x27;]},
      {id:&#x27;chemo&#x27;,n:&#x27;Chemogenetics / DREADDs&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:3.5,y:1,i:[&#x27;research&#x27;,&#x27;medical&#x27;],signal:&#x27;Ligand-gated engineered receptors&#x27;,res:&#x27;cell-type / projection specificity&#x27;,temp:&#x27;minutes to hours&#x27;,duration:&#x27;repeated dosing&#x27;,summary:&#x27;Chemogenetics controls genetically defined neurons with systemically delivered ligands instead of implanted optical hardware.&#x27;,mechanism:&#x27;Engineered G-protein-coupled receptors respond to selected drugs and alter cell excitability or signaling.&#x27;,standing:&#x27;Powerful preclinical method with nonhuman-primate translation; not an established human therapy.&#x27;,promise:&#x27;Long-duration, cell-specific modulation in freely behaving subjects.&#x27;,limit:&#x27;Gene delivery, ligand pharmacology, reversibility and slow time course.&#x27;,ex:[&#x27;DREADDs&#x27;],s:[&#x27;nih&#x27;],p:[]},
      {id:&#x27;magneto&#x27;,n:&#x27;Magnetothermal neuromodulation&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;write&#x27;,x:3.4,y:.6,i:[&#x27;research&#x27;],signal:&#x27;Magnetic nanoparticle heating&#x27;,res:&#x27;injected target volume / cell type&#x27;,temp:&#x27;seconds&#x27;,duration:&#x27;repeated remote sessions&#x27;,summary:&#x27;Magnetic nanoparticles transduce external fields into local heat that activates temperature-sensitive ion channels.&#x27;,mechanism:&#x27;Alternating magnetic fields heat nanoparticles near TRPV1-expressing neurons, remotely changing activity.&#x27;,standing:&#x27;Preclinical animal research.&#x27;,promise:&#x27;Wireless deep modulation without permanent leads.&#x27;,limit:&#x27;Nanoparticle delivery, heating control, genetic targeting and long-term safety.&#x27;,ex:[&#x27;magnetothermal DBS&#x27;],s:[&#x27;magneto&#x27;,&#x27;nih&#x27;],p:[]},
      {id:&#x27;pni&#x27;,n:&#x27;Peripheral nerve interfaces&#x27;,g:&#x27;stimulate&#x27;,o:&#x27;closed&#x27;,x:2.8,y:3,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Fascicular motor and sensory traffic&#x27;,res:&#x27;nerve / fascicle / axon bundle&#x27;,temp:&#x27;millisecond&#x27;,duration:&#x27;months to years&#x27;,summary:&#x27;Cuffs, intrafascicular arrays and regenerative electrodes create bidirectional links to limbs, organs and prostheses.&#x27;,mechanism:&#x27;Electrodes around, within or through a peripheral nerve record motor intent and deliver sensory or autonomic stimulation.&#x27;,standing:&#x27;Clinical use for selected stimulation therapies; high-channel bidirectional prosthetic interfaces remain specialized.&#x27;,promise:&#x27;Rich access downstream of the brain with anatomically organized pathways.&#x27;,limit:&#x27;Selectivity, nerve health, motion, encapsulation and stable decoding.&#x27;,ex:[&#x27;nerve cuffs&#x27;,&#x27;TIME&#x27;,&#x27;USEA&#x27;,&#x27;regenerative sieve&#x27;],s:[&#x27;hand&#x27;,&#x27;bmiRules&#x27;],p:[&#x27;p13&#x27;]},

      {id:&#x27;motorbci&#x27;,n:&#x27;Motor BCI for cursor and robotics&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:4,y:2.4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Motor intent -&gt; device commands&#x27;,res:&#x27;population-level decoder&#x27;,temp:&#x27;real-time&#x27;,duration:&#x27;sessions to chronic trials&#x27;,summary:&#x27;Motor BCIs translate attempted movement into control of cursors, robotic arms, wheelchairs or stimulation systems.&#x27;,mechanism:&#x27;A decoder maps neural features to continuous kinematics or discrete actions, often adapting with the user.&#x27;,standing:&#x27;Multiple implanted and non-invasive human demonstrations; implanted systems remain investigational.&#x27;,promise:&#x27;Independent control for people with severe paralysis.&#x27;,limit:&#x27;Calibration, robustness, caregiver burden, output speed and device lifecycle.&#x27;,ex:[&#x27;BrainGate&#x27;,&#x27;N1&#x27;,&#x27;Stentrode&#x27;],s:[&#x27;fdaBci&#x27;,&#x27;n1&#x27;,&#x27;stentrode&#x27;],p:[&#x27;p8&#x27;]},
      {id:&#x27;speechspike&#x27;,n:&#x27;Intracortical speech neuroprosthesis&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:4,y:2.4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Attempted speech spikes -&gt; text&#x27;,res:&#x27;small ventral motor / premotor regions&#x27;,temp:&#x27;streaming words&#x27;,duration:&#x27;multi-session trials&#x27;,summary:&#x27;High-resolution cortical recordings can decode unconstrained attempted speech into rapid text for people with paralysis.&#x27;,mechanism:&#x27;Recurrent or sequence models translate neural population activity related to articulators and phonemes into language.&#x27;,standing:&#x27;Landmark single-participant results reached 62 words/min with a large vocabulary; clinical generalization and durability remain open.&#x27;,promise:&#x27;Near-conversational communication for people who cannot speak.&#x27;,limit:&#x27;Few participants, retraining, neural drift and invasive hardware.&#x27;,ex:[&#x27;BrainGate speech BCI&#x27;],s:[&#x27;willett&#x27;,&#x27;fdaBci&#x27;],p:[&#x27;p4&#x27;,&#x27;p6&#x27;,&#x27;p7&#x27;,&#x27;p8&#x27;]},
      {id:&#x27;speechecog&#x27;,n:&#x27;ECoG speech, voice and avatar BCI&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:3.2,y:2.4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;High-gamma speech cortex -&gt; multimodal output&#x27;,res:&#x27;high-density surface grid&#x27;,temp:&#x27;real-time&#x27;,duration:&#x27;multi-session trials&#x27;,summary:&#x27;Surface recordings can drive text, synthesized speech and facial animation from silent speech attempts.&#x27;,mechanism:&#x27;Deep models decode articulatory and acoustic structure from high-density ECoG and render embodied communication.&#x27;,standing:&#x27;A 2023 participant achieved 78 words/min median text decoding plus speech and avatar control; investigational.&#x27;,promise:&#x27;Expressive communication without penetrating cortex.&#x27;,limit:&#x27;Cranial implant, participant scale, decoder stability and home deployment.&#x27;,ex:[&#x27;UCSF speech neuroprosthesis&#x27;],s:[&#x27;metzger&#x27;,&#x27;fdaBci&#x27;],p:[&#x27;p6&#x27;,&#x27;p8&#x27;]},
      {id:&#x27;brainspine&#x27;,n:&#x27;Brain-spine digital bridge&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:4,y:2.2,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Motor cortex -&gt; spinal stimulation&#x27;,res:&#x27;cortical decoder plus lumbosacral targets&#x27;,temp:&#x27;real-time gait control&#x27;,duration:&#x27;1+ year demonstration&#x27;,summary:&#x27;A fully implanted bridge reconnects cortical movement intent to patterned spinal stimulation below an injury.&#x27;,mechanism:&#x27;Wireless cortical recording drives state-dependent epidural stimulation programs that recruit leg muscles through spinal circuits.&#x27;,standing:&#x27;One landmark participant achieved stable standing and walking in community settings; broader trials are needed.&#x27;,promise:&#x27;Naturalistic control that combines bypass and rehabilitation.&#x27;,limit:&#x27;Highly individualized dual surgery, calibration and limited participant evidence.&#x27;,ex:[&#x27;STIMO-BSI&#x27;],s:[&#x27;lorach&#x27;],p:[&#x27;p6&#x27;,&#x27;p8&#x27;]},
      {id:&#x27;bionichand&#x27;,n:&#x27;Bidirectional bionic hand&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:2.9,y:2.4,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;EMG / nerve intent &lt;-&gt; tactile feedback&#x27;,res:&#x27;multi-DOF hand and nerve fascicles&#x27;,temp:&#x27;real-time&#x27;,duration:&#x27;chronic implants&#x27;,summary:&#x27;A prosthetic hand reads movement intent and writes biomimetic touch back into residual nerves.&#x27;,mechanism:&#x27;EMG or intraneural signals control the hand; prosthetic sensors drive patterned stimulation of sensory fascicles.&#x27;,standing:&#x27;Human research demonstrates better force control, object identification and dexterity; specialized rather than routine care.&#x27;,promise:&#x27;A prosthesis that feels and moves more like a body part.&#x27;,limit:&#x27;Surgery, calibration, channel count, long-term nerve interface and cost.&#x27;,ex:[&#x27;LUKE arm + Utah slanted arrays&#x27;,&#x27;TIME interfaces&#x27;],s:[&#x27;hand&#x27;],p:[&#x27;p6&#x27;,&#x27;p13&#x27;]},
      {id:&#x27;sensorybci&#x27;,n:&#x27;Cortical sensory feedback BCI&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:4,y:2.1,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Robot / sensor data -&gt; ICMS percepts&#x27;,res:&#x27;somatotopic microelectrodes&#x27;,temp:&#x27;real-time patterned feedback&#x27;,duration:&#x27;multi-year human studies&#x27;,summary:&#x27;Sensors on a robotic limb are encoded as tactile percepts through somatosensory cortex stimulation.&#x27;,mechanism:&#x27;Contact force or kinematic variables are mapped onto ICMS amplitude, frequency and electrode patterns.&#x27;,standing:&#x27;Human feasibility studies show stable localized touch and improved object interaction; naturalism remains limited.&#x27;,promise:&#x27;Close the sensorimotor loop for paralysis.&#x27;,limit:&#x27;Percept quality, electrode longevity, safe coding and high-dimensional write-in.&#x27;,ex:[&#x27;BrainGate sensory feedback&#x27;,&#x27;ICMS fingertip percepts&#x27;],s:[&#x27;fdaBci&#x27;],p:[&#x27;p5&#x27;,&#x27;p6&#x27;,&#x27;p12&#x27;]},
      {id:&#x27;visualcortex&#x27;,n:&#x27;Visual cortical prosthesis&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:4,y:2,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Camera / symbolic patterns -&gt; phosphenes&#x27;,res:&#x27;retinotopic cortical electrodes&#x27;,temp:&#x27;video-rate aspirations&#x27;,duration:&#x27;human feasibility studies&#x27;,summary:&#x27;Cortical arrays bypass the eye and optic nerve to evoke visual percepts directly in visual cortex.&#x27;,mechanism:&#x27;Image-processing algorithms map scenes or shapes onto patterned cortical stimulation.&#x27;,standing:&#x27;Human studies can evoke phosphenes and simple form perception; useful high-resolution vision is unresolved.&#x27;,promise:&#x27;A route for blindness regardless of retinal or optic-nerve damage.&#x27;,limit:&#x27;Phosphene interactions, cortical coverage, surgery, calibration and naturalistic coding.&#x27;,ex:[&#x27;Orion&#x27;,&#x27;intracortical visual arrays&#x27;],s:[&#x27;fdaBci&#x27;],p:[&#x27;p6&#x27;,&#x27;p12&#x27;]},
      {id:&#x27;memory&#x27;,n:&#x27;Hippocampal memory prosthesis&#x27;,g:&#x27;restore&#x27;,o:&#x27;closed&#x27;,x:3.8,y:1.8,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Ensemble code -&gt; patterned stimulation&#x27;,res:&#x27;hippocampal subfields&#x27;,temp:&#x27;event-linked&#x27;,duration:&#x27;acute human studies&#x27;,summary:&#x27;Model-based stimulation attempts to reinforce memory encoding by reproducing transformations between hippocampal regions.&#x27;,mechanism:&#x27;Multi-input multi-output models learn ensemble relationships and trigger stimulation patterns during encoding.&#x27;,standing:&#x27;Small human studies in epilepsy monitoring; exploratory.&#x27;,promise:&#x27;Targeted cognitive restoration after injury or disease.&#x27;,limit:&#x27;Distributed memory mechanisms, person-specific models, ethics and generalization.&#x27;,ex:[&#x27;hippocampal MIMO prosthesis&#x27;],s:[&#x27;ethics&#x27;],p:[&#x27;p6&#x27;]},
      {id:&#x27;cldepression&#x27;,n:&#x27;Closed-loop depression neuromodulation&#x27;,g:&#x27;compute&#x27;,o:&#x27;closed&#x27;,x:4,y:2,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Personalized mood biomarker -&gt; DBS&#x27;,res:&#x27;patient-specific limbic network&#x27;,temp:&#x27;state-triggered&#x27;,duration:&#x27;chronic n-of-1 studies&#x27;,summary:&#x27;Personalized sensing identifies a symptom biomarker and triggers stimulation only when a pathological state appears.&#x27;,mechanism:&#x27;Multi-day intracranial mapping selects both a biomarker site and a therapeutic target; an implanted device closes the loop.&#x27;,standing:&#x27;Dramatic n-of-1 proof of concept, not yet a general clinical therapy.&#x27;,promise:&#x27;Objective, individualized treatment for otherwise refractory psychiatric disease.&#x27;,limit:&#x27;Biomarker discovery, generalization, identity/agency concerns and invasive risk.&#x27;,ex:[&#x27;Scangos closed-loop MDD&#x27;],s:[&#x27;depression&#x27;,&#x27;ethics&#x27;],p:[&#x27;p13&#x27;]},

      {id:&#x27;spikesort&#x27;,n:&#x27;Automated spike sorting&#x27;,g:&#x27;compute&#x27;,o:&#x27;model&#x27;,x:4,y:3.8,i:[&#x27;research&#x27;],signal:&#x27;Raw extracellular voltage -&gt; putative units&#x27;,res:&#x27;single-unit assignments&#x27;,temp:&#x27;offline to near-real-time&#x27;,duration:&#x27;large chronic datasets&#x27;,summary:&#x27;Template matching and clustering transform overlapping multichannel waveforms into reproducible spike trains.&#x27;,mechanism:&#x27;Pipelines filter and whiten data, detect events, estimate templates, resolve overlaps, track drift and assign quality metrics.&#x27;,standing:&#x27;Kilosort-family and MountainSort pipelines are standard tools, but curation and ground truth remain active problems.&#x27;,promise:&#x27;Scalable analysis for hundreds to thousands of channels.&#x27;,limit:&#x27;Drift, overlapping spikes, noise models, false splits/merges and biological identity uncertainty.&#x27;,ex:[&#x27;Kilosort&#x27;,&#x27;MountainSort&#x27;,&#x27;SpikeInterface&#x27;],s:[&#x27;np2&#x27;],p:[&#x27;p9&#x27;,&#x27;p10&#x27;,&#x27;p11&#x27;]},
      {id:&#x27;decoder&#x27;,n:&#x27;Adaptive neural decoders&#x27;,g:&#x27;compute&#x27;,o:&#x27;model&#x27;,x:3.4,y:2.8,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Population activity -&gt; latent intent / state&#x27;,res:&#x27;task-dependent&#x27;,temp:&#x27;real-time&#x27;,duration:&#x27;cross-session adaptation&#x27;,summary:&#x27;Statistical and deep models translate high-dimensional neural activity into intended movement, speech, sensation or clinical state.&#x27;,mechanism:&#x27;Feature extraction, latent dynamics, sequence models and co-adaptation learn mappings between neural signals and outputs.&#x27;,standing:&#x27;Core of every modern BCI; impressive demonstrations still face data shift and patient-specific calibration.&#x27;,promise:&#x27;Turn noisy population activity into usable control.&#x27;,limit:&#x27;Distribution shift, interpretability, labels, privacy and safety under adaptation.&#x27;,ex:[&#x27;Kalman filters&#x27;,&#x27;RNNs&#x27;,&#x27;transformers&#x27;,&#x27;latent dynamical systems&#x27;],s:[&#x27;willett&#x27;,&#x27;metzger&#x27;],p:[&#x27;p4&#x27;,&#x27;p6&#x27;,&#x27;p7&#x27;,&#x27;p8&#x27;]},
      {id:&#x27;neuralcode&#x27;,n:&#x27;Temporal and population neural codes&#x27;,g:&#x27;compute&#x27;,o:&#x27;model&#x27;,x:4,y:1.7,i:[&#x27;research&#x27;],signal:&#x27;Spike timing and population trajectories&#x27;,res:&#x27;single neuron to network manifold&#x27;,temp:&#x27;milliseconds to weeks&#x27;,duration:&#x27;longitudinal experiments&#x27;,summary:&#x27;Engineering better interfaces depends on learning which features of population activity remain meaningful and stable over time.&#x27;,mechanism:&#x27;Longitudinal recordings compare rate, timing, synchrony, connectivity and low-dimensional trajectories as candidate codes.&#x27;,standing:&#x27;Foundational research; 2025 NET data showed temporal codes can stabilize visual representations beyond firing rate alone.&#x27;,promise:&#x27;More robust decoders and more natural synthetic write-in patterns.&#x27;,limit:&#x27;Context dependence, representational drift and incomplete causal understanding.&#x27;,ex:[&#x27;rate codes&#x27;,&#x27;temporal codes&#x27;,&#x27;neural manifolds&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p4&#x27;,&#x27;p6&#x27;,&#x27;p7&#x27;]},
      {id:&#x27;nwb&#x27;,n:&#x27;Open neural data standards and archives&#x27;,g:&#x27;compute&#x27;,o:&#x27;model&#x27;,x:.2,y:3.3,i:[&#x27;research&#x27;],signal:&#x27;Multimodal experimental data&#x27;,res:&#x27;from spikes to behavior and metadata&#x27;,temp:&#x27;entire study lifecycle&#x27;,duration:&#x27;long-term reuse&#x27;,summary:&#x27;Shared formats, provenance and cloud archives make large neurotechnology datasets reproducible and interoperable.&#x27;,mechanism:&#x27;Standard schemas, APIs, metadata and validation capture signals, units, behavior, devices and analysis provenance.&#x27;,standing:&#x27;Growing ecosystem across BRAIN Initiative and international neuroscience.&#x27;,promise:&#x27;Reanalysis, benchmarking, collaboration and trustworthy pipelines.&#x27;,limit:&#x27;Metadata burden, legacy conversion, privacy and uneven incentives.&#x27;,ex:[&#x27;NWB&#x27;,&#x27;DANDI&#x27;,&#x27;DABI&#x27;,&#x27;BIDS&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p9&#x27;,&#x27;p10&#x27;,&#x27;p11&#x27;]},
      {id:&#x27;digitaltwin&#x27;,n:&#x27;Multiscale circuit models and digital twins&#x27;,g:&#x27;compute&#x27;,o:&#x27;model&#x27;,x:.1,y:1.8,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Anatomy + physiology + behavior -&gt; simulation&#x27;,res:&#x27;ion channel to whole-brain network&#x27;,temp:&#x27;microseconds to disease progression&#x27;,duration:&#x27;iterative personalized models&#x27;,summary:&#x27;Computational models integrate data across scales to explain mechanisms, test interventions and eventually personalize stimulation.&#x27;,mechanism:&#x27;Biophysical, dynamical and machine-learning models simulate neurons, fields, networks and behavior under candidate perturbations.&#x27;,standing:&#x27;Indispensable research methodology; patient-specific predictive digital twins remain an emerging clinical frontier.&#x27;,promise:&#x27;Safer in-silico experiments, mechanism discovery and closed-loop controller design.&#x27;,limit:&#x27;Identifiability, validation, missing biology and false precision.&#x27;,ex:[&#x27;volume-conductor models&#x27;,&#x27;whole-brain network models&#x27;,&#x27;virtual DBS&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p1&#x27;,&#x27;p6&#x27;,&#x27;p13&#x27;]},
      {id:&#x27;neuromorphic&#x27;,n:&#x27;Neuromorphic neural coprocessors&#x27;,g:&#x27;compute&#x27;,o:&#x27;model&#x27;,x:2.4,y:1.2,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Spikes / biomarkers -&gt; low-power inference&#x27;,res:&#x27;implant or wearable edge compute&#x27;,temp:&#x27;real-time&#x27;,duration:&#x27;chronic aspirations&#x27;,summary:&#x27;Event-driven silicon aims to decode or control neural systems inside strict power, heat and latency budgets.&#x27;,mechanism:&#x27;Spiking networks, ASICs and compressed algorithms process sparse neural events close to the sensor.&#x27;,standing:&#x27;Active preclinical and engineering frontier with selected implantable prototypes.&#x27;,promise:&#x27;Always-on closed loops without streaming every raw sample.&#x27;,limit:&#x27;Validation, programmability, energy accounting, updates and safety certification.&#x27;,ex:[&#x27;neural ASICs&#x27;,&#x27;spiking controllers&#x27;],s:[&#x27;nih&#x27;],p:[&#x27;p8&#x27;,&#x27;p10&#x27;]},

      {id:&#x27;organoid&#x27;,n:&#x27;Brain organoids and assembloids&#x27;,g:&#x27;regenerate&#x27;,o:&#x27;model&#x27;,x:3.1,y:1.2,i:[&#x27;research&#x27;],signal:&#x27;Developing human neural tissue activity&#x27;,res:&#x27;cellular / organoid-scale&#x27;,temp:&#x27;days to months of development&#x27;,duration:&#x27;long-term culture&#x27;,summary:&#x27;Stem-cell-derived neural tissues model development, disease, drug response and inter-region interactions in human genetic context.&#x27;,mechanism:&#x27;Patterned pluripotent cells self-organize into neural cell types and networks; assembloids fuse region-specific tissues.&#x27;,standing:&#x27;Rapidly expanding research platform, not a miniature conscious brain or clinical implant.&#x27;,promise:&#x27;Human-specific disease models and personalized testing.&#x27;,limit:&#x27;Maturation, vascularization, reproducibility, missing body inputs and ethics.&#x27;,ex:[&#x27;cerebral organoids&#x27;,&#x27;cortical-striatal assembloids&#x27;],s:[&#x27;ethics&#x27;],p:[]},
      {id:&#x27;brainoware&#x27;,n:&#x27;Organoid intelligence / Brainoware&#x27;,g:&#x27;regenerate&#x27;,o:&#x27;model&#x27;,x:3.4,y:.5,i:[&#x27;research&#x27;],signal:&#x27;Electrical stimulation &lt;-&gt; organoid network&#x27;,res:&#x27;high-density MEA interface&#x27;,temp:&#x27;spatiotemporal pulse patterns&#x27;,duration:&#x27;culture experiments&#x27;,summary:&#x27;A living brain organoid acts as an adaptive reservoir computer interfaced through a multielectrode array.&#x27;,mechanism:&#x27;Electrical inputs reshape nonlinear organoid dynamics; a conventional readout learns tasks from the resulting activity.&#x27;,standing:&#x27;Exploratory 2023 proof of concept for speech recognition and nonlinear prediction.&#x27;,promise:&#x27;A testbed for learning in living networks and biohybrid computation.&#x27;,limit:&#x27;Reproducibility, training control, viability, benchmarking and profound ethical questions.&#x27;,ex:[&#x27;Brainoware&#x27;],s:[&#x27;brainoware&#x27;,&#x27;ethics&#x27;],p:[]},
      {id:&#x27;scaffold&#x27;,n:&#x27;Neural scaffolds, hydrogels and cell grafts&#x27;,g:&#x27;regenerate&#x27;,o:&#x27;write&#x27;,x:3.2,y:1,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Biochemical and mechanical repair cues&#x27;,res:&#x27;lesion / tract scale&#x27;,temp:&#x27;weeks to months&#x27;,duration:&#x27;potentially permanent&#x27;,summary:&#x27;Tissue engineering combines biomaterials, cells and molecular cues to support axon growth, remyelination and circuit repair.&#x27;,mechanism:&#x27;Aligned fibers, injectable hydrogels, extracellular matrix and progenitor cells shape survival, migration and connectivity.&#x27;,standing:&#x27;Strong preclinical programs and selected early clinical cell studies; reliable functional CNS regeneration remains unsolved.&#x27;,promise:&#x27;Repair tissue rather than only bypassing it.&#x27;,limit:&#x27;Inhibitory scar environment, long-distance targeting, uncontrolled growth and functional integration.&#x27;,ex:[&#x27;aligned hydrogels&#x27;,&#x27;neural progenitor grafts&#x27;],s:[&#x27;ethics&#x27;],p:[]},
      {id:&#x27;resorb&#x27;,n:&#x27;Bioresorbable neural implants&#x27;,g:&#x27;regenerate&#x27;,o:&#x27;closed&#x27;,x:3.3,y:.9,i:[&#x27;medical&#x27;,&#x27;research&#x27;],signal:&#x27;Temporary sensing and stimulation&#x27;,res:&#x27;surface / local tissue&#x27;,temp:&#x27;acute to weeks&#x27;,duration:&#x27;designed to dissolve&#x27;,summary:&#x27;Biodegradable electronics provide temporary monitoring or therapy without a second removal surgery.&#x27;,mechanism:&#x27;Transient conductors, semiconductors, polymers and optical components perform then hydrolyze into designed byproducts.&#x27;,standing:&#x27;Preclinical systems can combine recording and optogenetic stimulation.&#x27;,promise:&#x27;Temporary interfaces for postoperative monitoring and healing.&#x27;,limit:&#x27;Lifetime control, packaging, byproduct safety, wireless power and clinical reliability.&#x27;,ex:[&#x27;bioresorbable ECoG&#x27;,&#x27;transient optoelectronics&#x27;],s:[&#x27;resorb&#x27;],p:[&#x27;p8&#x27;]},
      {id:&#x27;living&#x27;,n:&#x27;Living and biohybrid neural interfaces&#x27;,g:&#x27;regenerate&#x27;,o:&#x27;closed&#x27;,x:4,y:.6,i:[&#x27;research&#x27;],signal:&#x27;Host &lt;-&gt; engineered neural tissue&#x27;,res:&#x27;cellular biological bridge&#x27;,temp:&#x27;physiological&#x27;,duration:&#x27;chronic aspiration&#x27;,summary:&#x27;Living neurons or axonal tracts form a biological intermediary between synthetic hardware and host circuits.&#x27;,mechanism:&#x27;Engineered neural tissue integrates synaptically with the host while an optical or electrical interface communicates with the graft.&#x27;,standing:&#x27;Early preclinical frontier.&#x27;,promise:&#x27;Biological multiplexing, regeneration and a softer long-term interface.&#x27;,limit:&#x27;Control, survival, connectivity, immunology, manufacturing and ethics.&#x27;,ex:[&#x27;living electrodes&#x27;,&#x27;micro-TENN pathways&#x27;],s:[&#x27;ethics&#x27;],p:[]},

      {id:&#x27;neurofeedback&#x27;,n:&#x27;EEG / fNIRS neurofeedback&#x27;,g:&#x27;personal&#x27;,o:&#x27;closed&#x27;,x:.8,y:2.5,i:[&#x27;medical&#x27;,&#x27;research&#x27;,&#x27;personal&#x27;],signal:&#x27;Brain-derived metric -&gt; feedback&#x27;,res:&#x27;network / band-power proxy&#x27;,temp:&#x27;seconds&#x27;,duration:&#x27;training sessions&#x27;,summary:&#x27;Neurofeedback makes a selected neural feature visible or audible so users can learn to influence it.&#x27;,mechanism:&#x27;Real-time preprocessing converts EEG or hemodynamic features into a reward signal during practice.&#x27;,standing:&#x27;Clinical evidence varies sharply by condition and protocol; consumer wellness use is widespread.&#x27;,promise:&#x27;Non-pharmacological self-regulation and closed-loop training.&#x27;,limit:&#x27;Proxy validity, placebo/blinding, artifact learning, protocol heterogeneity and exaggerated claims.&#x27;,ex:[&#x27;SMR training&#x27;,&#x27;alpha feedback&#x27;,&#x27;fNIRS feedback&#x27;],s:[&#x27;consumer&#x27;,&#x27;ethics&#x27;],p:[&#x27;p1&#x27;]},

      {id:&#x27;emg&#x27;,n:&#x27;EMG and peripheral gesture interfaces&#x27;,g:&#x27;personal&#x27;,o:&#x27;closed&#x27;,x:1.1,y:3.4,i:[&#x27;medical&#x27;,&#x27;research&#x27;,&#x27;personal&#x27;],signal:&#x27;Motor-unit activity in muscle / nerve&#x27;,res:&#x27;forearm or residual limb&#x27;,temp:&#x27;millisecond&#x27;,duration:&#x27;daily wearable use&#x27;,summary:&#x27;Surface EMG often provides a higher-bandwidth, lower-risk control signal than EEG for prosthetics, accessibility and spatial computing.&#x27;,mechanism:&#x27;Electrode arrays decode patterns produced by motor units before or during subtle movement.&#x27;,standing:&#x27;Established in myoelectric prostheses and growing in consumer gesture interfaces.&#x27;,promise:&#x27;Fast, wearable intent decoding without brain surgery.&#x27;,limit:&#x27;It is not a direct brain signal; sweat, placement, fatigue and limb physiology shift the mapping.&#x27;,ex:[&#x27;myoelectric prostheses&#x27;,&#x27;wrist EMG&#x27;],s:[&#x27;hand&#x27;],p:[]},
      {&quot;id&quot;:&quot;eareeg&quot;,&quot;n&quot;:&quot;Ear-centered and in-ear EEG&quot;,&quot;g&quot;:&quot;record&quot;,&quot;o&quot;:&quot;read&quot;,&quot;x&quot;:1,&quot;y&quot;:2.8,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;,&quot;personal&quot;],&quot;signal&quot;:&quot;Electrical potentials in or around the ear&quot;,&quot;res&quot;:&quot;typically 2-20 short-baseline channels&quot;,&quot;temp&quot;:&quot;millisecond&quot;,&quot;duration&quot;:&quot;hours to multi-day ambulatory sessions&quot;,&quot;summary&quot;:&quot;Concealed electrodes in the ear canal, concha or around the pinna trade spatial coverage for comfort and long-term real-world recording.&quot;,&quot;mechanism&quot;:&quot;Miniaturized wet, dry or flex-printed electrodes sample volume-conducted cortical fields and evoked responses near the ear, often with a wireless amplifier.&quot;,&quot;standing&quot;:&quot;Validated for sleep, auditory attention, evoked potentials and mobile experiments; clinical-grade all-day use remains application-specific.&quot;,&quot;promise&quot;:&quot;Hearing-aid-integrated attention steering, sleep monitoring and low-friction longitudinal neurophysiology.&quot;,&quot;limit&quot;:&quot;Smaller amplitudes, restricted source sensitivity, motion and jaw artifacts, individual ear geometry and limited montage coverage.&quot;,&quot;ex&quot;:[&quot;cEEGrid&quot;,&quot;in-ear EEG&quot;,&quot;earbud EEG&quot;],&quot;s&quot;:[&quot;eareeg&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;microdialysis&quot;,&quot;n&quot;:&quot;Cerebral microdialysis&quot;,&quot;g&quot;:&quot;record&quot;,&quot;o&quot;:&quot;read&quot;,&quot;x&quot;:4,&quot;y&quot;:3.4,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Extracellular metabolites and neurochemicals&quot;,&quot;res&quot;:&quot;millimeter-scale tissue around one catheter&quot;,&quot;temp&quot;:&quot;minutes to hourly fractions&quot;,&quot;duration&quot;:&quot;days of neurocritical-care monitoring&quot;,&quot;summary&quot;:&quot;A semipermeable intracerebral catheter continuously samples extracellular chemistry near injured or at-risk brain tissue.&quot;,&quot;mechanism&quot;:&quot;Perfusate flows through a membrane and equilibrates with local glucose, lactate, pyruvate, glutamate, glycerol and other analytes that are measured at the bedside or in a laboratory.&quot;,&quot;standing&quot;:&quot;Established adjunct in selected neurocritical-care centers for traumatic brain injury and subarachnoid hemorrhage, with updated international consensus guidance.&quot;,&quot;promise&quot;:&quot;Direct metabolic warning of secondary injury and individualized treatment response unavailable from electrical or hemodynamic monitors alone.&quot;,&quot;limit&quot;:&quot;Highly local and invasive sampling, delayed measurements, calibration and recovery uncertainty, specialized workflow and incomplete outcome evidence.&quot;,&quot;ex&quot;:[&quot;CMA cerebral microdialysis&quot;,&quot;lactate/pyruvate ratio monitoring&quot;],&quot;s&quot;:[&quot;microdialysis&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;aptamer&quot;,&quot;n&quot;:&quot;Aptamer and field-effect neurochemical probes&quot;,&quot;g&quot;:&quot;record&quot;,&quot;o&quot;:&quot;read&quot;,&quot;x&quot;:4,&quot;y&quot;:1.3,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Molecular binding converted to electrical current or voltage&quot;,&quot;res&quot;:&quot;microscale local chemistry&quot;,&quot;temp&quot;:&quot;seconds to minutes&quot;,&quot;duration&quot;:&quot;acute in-vivo demonstrations&quot;,&quot;summary&quot;:&quot;Synthetic nucleic-acid receptors add molecular specificity to implantable electronics for label-free neurotransmitter and metabolite sensing.&quot;,&quot;mechanism&quot;:&quot;Target binding changes aptamer conformation and surface charge, modulating a field-effect transistor or electrochemical interface near the probe.&quot;,&quot;standing&quot;:&quot;Preclinical probes have detected serotonin and dopamine in brain tissue; chronic quantitative in-vivo use is still an engineering frontier.&quot;,&quot;promise&quot;:&quot;Continuous multiplexed chemistry alongside electrophysiology for mechanistic studies and biomarker-driven closed loops.&quot;,&quot;limit&quot;:&quot;Biofouling, drift, selectivity in complex tissue, reference calibration, probe lifetime and limited validated aptamers.&quot;,&quot;ex&quot;:[&quot;aptamer-FET serotonin probe&quot;,&quot;graphene dopamine aptasensor&quot;],&quot;s&quot;:[&quot;aptamer&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;photoacoustic&quot;,&quot;n&quot;:&quot;Functional photoacoustic neuroimaging&quot;,&quot;g&quot;:&quot;record&quot;,&quot;o&quot;:&quot;read&quot;,&quot;x&quot;:0,&quot;y&quot;:1.5,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Optical absorption converted to ultrasound&quot;,&quot;res&quot;:&quot;submillimeter to millimeter in accessible tissue&quot;,&quot;temp&quot;:&quot;subsecond to seconds&quot;,&quot;duration&quot;:&quot;imaging sessions&quot;,&quot;summary&quot;:&quot;Photoacoustic tomography combines optical contrast with ultrasonic detection to image cerebral blood oxygenation, flow and potentially molecular reporters.&quot;,&quot;mechanism&quot;:&quot;Nanosecond light pulses cause absorbers such as hemoglobin to thermoelastically expand; transducer arrays detect the emitted acoustic waves and reconstruct 3D images.&quot;,&quot;standing&quot;:&quot;Functional human-brain demonstrations exist, but skull distortion, light penetration and system scale keep it preclinical or early feasibility.&quot;,&quot;promise&quot;:&quot;Label-free hemodynamic imaging with richer optical contrast and finer resolution than many diffuse optical methods.&quot;,&quot;limit&quot;:&quot;Skull and scalp attenuation, acoustic aberration, laser exposure limits, bulky arrays and uncertain whole-brain depth.&quot;,&quot;ex&quot;:[&quot;PACT&quot;,&quot;optoacoustic tomography&quot;],&quot;s&quot;:[&quot;photoacoustic&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;ti&quot;,&quot;n&quot;:&quot;Temporal-interference stimulation&quot;,&quot;g&quot;:&quot;stimulate&quot;,&quot;o&quot;:&quot;write&quot;,&quot;x&quot;:0.5,&quot;y&quot;:1.8,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Overlapping kilohertz electric fields with a low-frequency envelope&quot;,&quot;res&quot;:&quot;modeled deep target; centimeter scale&quot;,&quot;temp&quot;:&quot;continuous or patterned sessions&quot;,&quot;duration&quot;:&quot;minutes per session&quot;,&quot;summary&quot;:&quot;Temporal interference uses multiple high-frequency scalp currents whose difference-frequency envelope is strongest at a steered deep target.&quot;,&quot;mechanism&quot;:&quot;Neural membranes largely reject each kilohertz carrier while their superposition creates a low-frequency amplitude modulation intended to drive excitable tissue at depth.&quot;,&quot;standing&quot;:&quot;Human hippocampal modulation and memory effects have been reported; targeting physics, mechanism and repeatability remain under active study.&quot;,&quot;promise&quot;:&quot;Steerable non-surgical access to deep structures that are difficult to reach with ordinary tES.&quot;,&quot;limit&quot;:&quot;Diffuse fields, peripheral co-stimulation, uncertain cellular mechanism, individual anatomy and limited clinical evidence.&quot;,&quot;ex&quot;:[&quot;tTIS&quot;,&quot;hippocampal temporal interference&quot;],&quot;s&quot;:[&quot;ti&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;ect&quot;,&quot;n&quot;:&quot;Electroconvulsive therapy&quot;,&quot;g&quot;:&quot;stimulate&quot;,&quot;o&quot;:&quot;write&quot;,&quot;x&quot;:0,&quot;y&quot;:4,&quot;i&quot;:[&quot;medical&quot;],&quot;signal&quot;:&quot;Brief high-current scalp pulses under anesthesia&quot;,&quot;res&quot;:&quot;whole-brain seizure with montage-dependent field&quot;,&quot;temp&quot;:&quot;seconds of stimulation&quot;,&quot;duration&quot;:&quot;acute series plus possible maintenance&quot;,&quot;summary&quot;:&quot;ECT deliberately induces a generalized therapeutic seizure and remains one of the fastest, most effective treatments for severe depression and catatonia.&quot;,&quot;mechanism&quot;:&quot;Anesthetized bilateral or unilateral cranial stimulation triggers a controlled seizure whose distributed neuroplastic and network effects produce clinical benefit.&quot;,&quot;standing&quot;:&quot;Established medical standard with FDA-classified devices and decades of outcome evidence.&quot;,&quot;promise&quot;:&quot;Rapid response in life-threatening, psychotic or treatment-resistant illness when slower therapies fail.&quot;,&quot;limit&quot;:&quot;Anesthesia burden, acute confusion, autobiographical-memory effects, stigma, relapse and access disparities.&quot;,&quot;ex&quot;:[&quot;right-unilateral ultrabrief ECT&quot;,&quot;bilateral ECT&quot;],&quot;s&quot;:[&quot;ect&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;tscs&quot;,&quot;n&quot;:&quot;Transcutaneous spinal-cord stimulation&quot;,&quot;g&quot;:&quot;stimulate&quot;,&quot;o&quot;:&quot;closed&quot;,&quot;x&quot;:1,&quot;y&quot;:2.8,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Electrical pulses through skin over spinal roots&quot;,&quot;res&quot;:&quot;cervical or lumbosacral segments&quot;,&quot;temp&quot;:&quot;task-synchronized or tonic sessions&quot;,&quot;duration&quot;:&quot;weeks of rehabilitation; repeat use&quot;,&quot;summary&quot;:&quot;Non-invasive spinal stimulation raises the excitability of spared sensorimotor circuits so rehabilitation and voluntary commands can recruit them more effectively.&quot;,&quot;mechanism&quot;:&quot;Surface electrodes deliver patterned current across selected spinal segments while the user practices movement, engaging dorsal roots and interneuronal networks.&quot;,&quot;standing&quot;:&quot;A 60-person pivotal trial showed improved arm and hand function after chronic cervical injury; deployment and long-term protocols continue to develop.&quot;,&quot;promise&quot;:&quot;Lower-risk access to spinal neuromodulation without implanted leads.&quot;,&quot;limit&quot;:&quot;Less focal than epidural systems, strong skin and muscle sensations, responder variability and dependence on residual pathways and training.&quot;,&quot;ex&quot;:[&quot;ARC-EX&quot;,&quot;transcutaneous cervical stimulation&quot;],&quot;s&quot;:[&quot;tscs&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;scspain&quot;,&quot;n&quot;:&quot;Implanted spinal-cord stimulation for pain&quot;,&quot;g&quot;:&quot;stimulate&quot;,&quot;o&quot;:&quot;closed&quot;,&quot;x&quot;:3,&quot;y&quot;:4,&quot;i&quot;:[&quot;medical&quot;],&quot;signal&quot;:&quot;Epidural electrical pulses&quot;,&quot;res&quot;:&quot;selected dorsal-column segments&quot;,&quot;temp&quot;:&quot;tonic, burst or kilohertz patterns&quot;,&quot;duration&quot;:&quot;chronic implanted therapy&quot;,&quot;summary&quot;:&quot;Spinal-cord stimulation is a mature implant therapy for selected chronic neuropathic pain syndromes and failed-back-surgery pain.&quot;,&quot;mechanism&quot;:&quot;Epidural leads driven by an implanted pulse generator alter dorsal-column and dorsal-horn signaling using paresthesia-based or sub-perception waveforms.&quot;,&quot;standing&quot;:&quot;Multiple FDA-approved systems and decades of clinical use; comparative durability and patient selection remain active questions.&quot;,&quot;promise&quot;:&quot;Reversible, adjustable relief that can reduce pain and medication burden for carefully selected patients.&quot;,&quot;limit&quot;:&quot;Surgery, infection and lead migration, battery procedures, trial failures, variable durability, cost and explant rates.&quot;,&quot;ex&quot;:[&quot;Proclaim XR&quot;,&quot;burst SCS&quot;,&quot;10-kHz SCS&quot;],&quot;s&quot;:[&quot;scspain&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;vestibular&quot;,&quot;n&quot;:&quot;Multichannel vestibular implant&quot;,&quot;g&quot;:&quot;restore&quot;,&quot;o&quot;:&quot;closed&quot;,&quot;x&quot;:4,&quot;y&quot;:2.1,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Head-motion sensors to vestibular-nerve pulse trains&quot;,&quot;res&quot;:&quot;individual semicircular-canal branches&quot;,&quot;temp&quot;:&quot;continuous real-time&quot;,&quot;duration&quot;:&quot;multi-year implant aspiration&quot;,&quot;summary&quot;:&quot;A vestibular implant substitutes for damaged inner-ear motion sensors to restore reflexes that stabilize vision, posture and gait.&quot;,&quot;mechanism&quot;:&quot;An inertial sensor estimates 3D head rotation and modulates electrical stimulation through electrodes placed near three ampullary vestibular nerve branches.&quot;,&quot;standing&quot;:&quot;First-in-human chronic multichannel studies in eight participants reported gait and quality-of-life improvements; hearing preservation and broader efficacy remain unresolved.&quot;,&quot;promise&quot;:&quot;A bionic balance sense for people with otherwise untreatable bilateral vestibular loss.&quot;,&quot;limit&quot;:&quot;Delicate inner-ear surgery, hearing loss, current spread, adaptation, calibration and very small clinical cohorts.&quot;,&quot;ex&quot;:[&quot;Johns Hopkins multichannel vestibular implant&quot;],&quot;s&quot;:[&quot;vestibular&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;neuraldust&quot;,&quot;n&quot;:&quot;Ultrasonic neural dust and microimplants&quot;,&quot;g&quot;:&quot;restore&quot;,&quot;o&quot;:&quot;closed&quot;,&quot;x&quot;:4,&quot;y&quot;:1.2,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Electrophysiology modulated onto ultrasonic backscatter&quot;,&quot;res&quot;:&quot;millimeter implant near nerve or muscle&quot;,&quot;temp&quot;:&quot;millisecond neural signals&quot;,&quot;duration&quot;:&quot;acute in-vivo demonstrations; chronic goal&quot;,&quot;summary&quot;:&quot;Batteryless piezoelectric motes use ultrasound for both power and communication, enabling much smaller deep implants than conventional radio links.&quot;,&quot;mechanism&quot;:&quot;An external transducer beams ultrasound to a piezoelectric mote; local bioelectric signals alter its load and therefore the amplitude of the reflected acoustic carrier.&quot;,&quot;standing&quot;:&quot;Rodent peripheral-nerve and muscle recordings established the concept; networks, chronic encapsulation and human translation remain experimental.&quot;,&quot;promise&quot;:&quot;Distributed minimally tethered sensors and stimulators close to small nerves throughout the body.&quot;,&quot;limit&quot;:&quot;Alignment, packaging, fibrosis, uplink bandwidth, addressability, implantation logistics and safety of chronic insonation.&quot;,&quot;ex&quot;:[&quot;neural dust&quot;,&quot;ultrasonic backscatter implant&quot;,&quot;DustNet&quot;],&quot;s&quot;:[&quot;neuraldust&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;magnetoelectric&quot;,&quot;n&quot;:&quot;Magnetoelectric wireless neural implants&quot;,&quot;g&quot;:&quot;stimulate&quot;,&quot;o&quot;:&quot;closed&quot;,&quot;x&quot;:4,&quot;y&quot;:1.5,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;External magnetic field converted to local electrical pulses&quot;,&quot;res&quot;:&quot;millimeter-scale implant&quot;,&quot;temp&quot;:&quot;programmable therapeutic frequencies&quot;,&quot;duration&quot;:&quot;chronic preclinical use&quot;,&quot;summary&quot;:&quot;Magnetoelectric laminates efficiently convert weak alternating magnetic fields into voltages that power miniature leadless neural stimulators.&quot;,&quot;mechanism&quot;:&quot;Magnetostrictive strain mechanically couples into a piezoelectric layer; rectification and control electronics turn the induced voltage into biphasic stimulation.&quot;,&quot;standing&quot;:&quot;Millimeter devices have stimulated brain and peripheral nerves in freely moving animals, including endovascular and regenerative demonstrations.&quot;,&quot;promise&quot;:&quot;Battery-free implants deep under tissue with better miniaturization and misalignment tolerance than small inductive coils.&quot;,&quot;limit&quot;:&quot;Packaging, orientation, external transmitter ergonomics, bidirectional data, heating and long-term material reliability.&quot;,&quot;ex&quot;:[&quot;ME-BIT&quot;,&quot;self-rectifying magnetoelectric metamaterial&quot;],&quot;s&quot;:[&quot;magnetoelectric&quot;],&quot;p&quot;:[]},
      {&quot;id&quot;:&quot;sonogenetics&quot;,&quot;n&quot;:&quot;Sonogenetic neuromodulation&quot;,&quot;g&quot;:&quot;stimulate&quot;,&quot;o&quot;:&quot;write&quot;,&quot;x&quot;:2,&quot;y&quot;:0.9,&quot;i&quot;:[&quot;medical&quot;,&quot;research&quot;],&quot;signal&quot;:&quot;Focused ultrasound acting on genetically sensitized cells&quot;,&quot;res&quot;:&quot;cell type plus acoustic focal volume&quot;,&quot;temp&quot;:&quot;millisecond to second pulses&quot;,&quot;duration&quot;:&quot;preclinical experimental sessions&quot;,&quot;summary&quot;:&quot;Sonogenetics combines targeted expression of mechanosensitive proteins with focused ultrasound to control selected neurons deep in tissue without implanted optical fibers.&quot;,&quot;mechanism&quot;:&quot;Viral or genetic delivery makes chosen cells express an ultrasound-responsive ion channel such as hsTRPA1 or MscL; acoustic mechanical forces then gate the channel.&quot;,&quot;standing&quot;:&quot;Demonstrated in worms and intact mammalian brains, including behavior; no established human application.&quot;,&quot;promise&quot;:&quot;Deep, cell-type-specific noninvasive control that merges genetic precision with ultrasound penetration.&quot;,&quot;limit&quot;:&quot;Gene-delivery risk, actuator specificity, acoustic confounds, mechanism and dose uncertainty, immunogenicity and regulatory complexity.&quot;,&quot;ex&quot;:[&quot;hsTRPA1 sonogenetics&quot;,&quot;MscL visual restoration&quot;],&quot;s&quot;:[&quot;sonogenetics&quot;],&quot;p&quot;:[]},
